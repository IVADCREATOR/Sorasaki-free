<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0614"/>
      <stop offset="1" stop-color="#16082b"/>
    </linearGradient>
    <linearGradient id="borda" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b2cff"/>
      <stop offset="0.5" stop-color="#e3b8ff"/>
      <stop offset="1" stop-color="#7b2cff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="brilho" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feGaussianBlur stdDeviation="14" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t { font: 800 74px 'Segoe UI', Verdana, sans-serif; letter-spacing: 10px; fill: #f3e6ff; }
      .s { font: 600 20px 'Segoe UI', Verdana, sans-serif; letter-spacing: 12px; fill: #c79bff; }
      .pisca { animation: pisca 5s infinite; }
      .pulso { animation: pulso 3s ease-in-out infinite; }
      @keyframes pisca { 0%,18%,22%,25%,53%,57%,100% { opacity: 1 } 20%,24%,55% { opacity: .35 } }
      @keyframes pulso { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
    </style>
  </defs>
  <rect x="4" y="4" width="892" height="192" rx="22" fill="url(#fundo)"/>
  <rect x="4" y="4" width="892" height="192" rx="22" fill="none" stroke="url(#borda)" stroke-width="3" filter="url(#brilho)" class="pulso"/>
  <g filter="url(#brilho)" class="pisca">
    <text x="450" y="112" text-anchor="middle" class="t" stroke="#a259ff" stroke-width="2">SORASAKI</text>
  </g>
  <text x="450" y="156" text-anchor="middle" class="s pulso">VERSION FREE</text>
  <g fill="#e3b8ff" class="pulso">
    <circle cx="60" cy="50" r="2"/><circle cx="120" cy="150" r="1.5"/><circle cx="820" cy="44" r="2"/>
    <circle cx="780" cy="160" r="1.5"/><circle cx="200" cy="40" r="1.2"/><circle cx="700" cy="30" r="1.2"/>
  </g>
</svg>
